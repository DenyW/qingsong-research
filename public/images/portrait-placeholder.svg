<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Abstract portrait placeholder</title>
  <desc id="desc">A geometric portrait silhouette in ink, cobalt and orange, with a large Q monogram. Replace with a 4:5 photograph.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2ecdf"/>
      <stop offset="1" stop-color="#ded5c3"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#f4f1e8" opacity="0.22"/>
    </pattern>
    <clipPath id="frame">
      <rect x="24" y="24" width="752" height="952" rx="2"/>
    </clipPath>
  </defs>

  <rect width="800" height="1000" fill="url(#paper)"/>
  <g clip-path="url(#frame)">
    <circle cx="660" cy="170" r="230" fill="#2c46ff"/>
    <circle cx="390" cy="355" r="270" fill="#e85d3f"/>
    <path d="M175 930 C185 710 285 625 400 625 C515 625 615 710 625 930 Z" fill="#171614"/>
    <ellipse cx="400" cy="390" rx="150" ry="185" fill="#171614"/>
    <path d="M175 930 C185 710 285 625 400 625 C515 625 615 710 625 930 Z" fill="url(#dots)"/>
    <ellipse cx="400" cy="390" rx="150" ry="185" fill="url(#dots)"/>
    <path d="M250 390 C250 285 320 205 400 205 C480 205 550 285 550 390" fill="none" stroke="#f4f1e8" stroke-width="3" opacity="0.28"/>
    <g stroke="#171614" stroke-width="1" opacity="0.13">
      <path d="M0 160H800M0 320H800M0 480H800M0 640H800M0 800H800"/>
      <path d="M160 0V1000M320 0V1000M480 0V1000M640 0V1000"/>
    </g>
    <text x="56" y="878" fill="#f4f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-style="italic">Q</text>
    <rect x="24" y="24" width="752" height="952" fill="none" stroke="#171614" stroke-width="2"/>
    <g stroke="#171614" stroke-width="2">
      <path d="M24 84V24H84M716 24H776V84M776 916V976H716M84 976H24V916"/>
    </g>
    <g fill="#171614" font-family="'Courier New', monospace" font-size="15" letter-spacing="2">
      <text x="56" y="944">PORTRAIT / PLACEHOLDER</text>
      <text x="744" y="944" text-anchor="end">4:5</text>
